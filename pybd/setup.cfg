
[metadata]
name = pybd
version = 0.0.1
author = AnikDutta-AI
author_email = anikdatta@gmail.com
description = A Python package created by AnikDutta-AI
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE
url = https://github.com/AnikDutta-AI/Pybd-Pypi-Pakage

project_urls =
    Bug Tracker = https://github.com/AnikDutta-AI/Pybd-Pypi-Pakage/issues
    Source Code = https://github.com/AnikDutta-AI/Pybd-Pypi-Pakage

classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Intended Audience :: Education
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.package_data]
pybd = py.typed

[options.extras_require]
testing =
    pytest>=8.0
    pytest-cov>=5.0

[flake8]
max-line-length = 160
exclude =
    .git,
    __pycache__,
    build,
    dist
