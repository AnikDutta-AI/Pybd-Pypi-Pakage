
name: Python Package Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      # 1. Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 3. Install package and development dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install flake8

      # 4. Check for critical Python errors
      - name: Lint with flake8
        run: |
          flake8 src tests \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics

      # 5. Run automated tests
      - name: Test with pytest
        run: |
          python -m pytest -v

      # 6. Build wheel and source distribution
      - name: Build package
        run: |
          python -m build

      # 7. Validate distribution files
      - name: Check package distributions
        run: |
          python -m twine check dist/*
